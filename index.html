<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NS Secure Chat</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #efeae2; display: flex; flex-direction: column; height: 100vh; }
    .header { background-color: #075e54; color: white; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; }
    .chat-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .message { max-width: 75%; padding: 10px; border-radius: 10px; position: relative; }
    .msg-guest { background-color: #fff; align-self: flex-start; border-top-left-radius: 0; }
    .msg-admin { background-color: #dcf8c6; align-self: flex-end; border-top-right-radius: 0; }
    .sender-name { font-size: 11px; font-weight: bold; color: #075e54; margin-bottom: 4px; display: block; }
    .input-area { display: flex; padding: 10px; background-color: #f0f0f0; }
    input[type="text"] { flex: 1; padding: 12px; border-radius: 20px; border: none; outline: none; margin-right: 10px; }
    button { background-color: #128c7e; color: white; border: none; padding: 12px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
  <div class="header">NS Live Desk</div>
  <div class="chat-container" id="chat-box"></div>
  <div class="input-area">
    <input type="text" id="message-input" placeholder="मैसेज टाइप करें...">
    <button id="send-btn">Send</button>
  </div>

  <script type="module">
    import { ConvexClient } from "https://esm.sh/convex/browser";
    
    // आपका Cloud URL यहाँ सेट है
    const client = new ConvexClient("https://beloved-hare-920.convex.cloud");
    
    const urlParams = new URLSearchParams(window.location.search);
    const currentRoom = urlParams.get('room') || 'default-room';
    
    let userName = localStorage.getItem("ns_chat_name");
    if (!userName) {
        userName = prompt("कृपया अपना नाम दर्ज करें:") || "Guest";
        localStorage.setItem("ns_chat_name", userName);
    }

    client.onUpdate("messages:getMessages", { roomId: currentRoom }, (messages) => {
      const chatBox = document.getElementById("chat-box");
      chatBox.innerHTML = messages.map(m => {
        const msgClass = m.sender === userName ? 'msg-admin' : 'msg-guest';
        return `<div class="message ${msgClass}">
                  <span class="sender-name">${m.sender}</span>
                  ${m.text}
                </div>`;
      }).join("");
      chatBox.scrollTop = chatBox.scrollHeight;
    });

    document.getElementById("send-btn").onclick = () => {
      const input = document.getElementById("message-input");
      if(input.value.trim() !== "") {
        client.mutation("messages:sendMessage", { 
          roomId: currentRoom, 
          text: input.value, 
          sender: userName 
        });
        input.value = "";
      }
    };
  </script>
</body>
</html>
