<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Live Chat Widget</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background: transparent; overflow: hidden; height: 100vh; }
    .widget-container { display: flex; flex-direction: column; height: 100%; background: white; border-radius: 15px; overflow: hidden; border: 1px solid #ddd; }
    .widget-header { background: #075e54; color: white; padding: 15px; text-align: center; font-weight: bold; }
    
    #lead-form { padding: 20px; flex: 1; display: flex; flex-direction: column; justify-content: center; }
    #lead-form h3 { margin-top: 0; color: #333; font-size: 16px; text-align: center; }
    #lead-form input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; box-sizing: border-box; }
    #lead-form button { width: 100%; padding: 12px; background: #128c7e; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; }
    
    #chat-frame { display: none; width: 100%; height: 100%; border: none; flex: 1; }
  </style>
</head>
<body>

  <div class="widget-container">
    <div class="widget-header">
      Live Support
    </div>
    
    <div id="lead-form">
      <h3>Enter details to start chat</h3>
      <input type="text" id="visitor-name" placeholder="Your Name" required>
      <input type="tel" id="visitor-mobile" placeholder="Mobile Number" required>
      <button onclick="startWidgetChat()">Start Chat</button>
    </div>
    
    <iframe id="chat-frame" src=""></iframe>
  </div>

  <script type="module">
    import { ConvexClient } from "https://esm.sh/convex/browser";
    const CONVEX_URL = "https://beloved-hare-920.convex.cloud";
    const client = new ConvexClient(CONVEX_URL);

    window.startWidgetChat = async () => {
      const name = document.getElementById('visitor-name').value.trim();
      const mobile = document.getElementById('visitor-mobile').value.trim();
      
      if(!name || !mobile) {
        alert("Please enter your name and mobile number.");
        return;
      }

      const urlParams = new URLSearchParams(window.location.search);
      const source = urlParams.get('source') || 'Website';

      let room = localStorage.getItem('ns_widget_room');
      
      if (!room) {
        room = 'w_' + Date.now().toString(36) + '_' + Math.floor(Math.random()*1000);
        localStorage.setItem('ns_widget_room', room);
        
        await client.mutation("messages:sendMessage", {
          roomId: room,
          text: `🚨 New Visitor [${source}]:\n👤 Name: ${name}\n📱 Mobile: ${mobile}`,
          sender: "System"
        });
      }

      localStorage.setItem(`ns_chat_name_${room}`, name);
      document.getElementById('lead-form').style.display = 'none';
      const chatFrame = document.getElementById('chat-frame');
      chatFrame.src = `/?room=${room}`;
      chatFrame.style.display = 'block';
    };

    window.onload = () => {
      const existingRoom = localStorage.getItem('ns_widget_room');
      if(existingRoom) {
        document.getElementById('lead-form').style.display = 'none';
        const chatFrame = document.getElementById('chat-frame');
        chatFrame.src = `/?room=${existingRoom}`;
        chatFrame.style.display = 'block';
      }
    };
  </script>
</body>
</html>
