<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WhatsApp Chat</title>
  <!-- FontAwesome Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --wa-bg: #0b141a;
      --wa-header: #1f2c34;
      --wa-input-bg: #1f2c34;
      --wa-input-box: #2a3942;
      --wa-msg-sent: #005c4b;
      --wa-text: #e9edef;
      --wa-text-muted: #8696a0;
      --wa-green: #00a884;
      --wa-blue-tick: #53bdeb;
    }
    
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: var(--wa-bg); display: flex; flex-direction: column; height: 100dvh; color: var(--wa-text); overflow: hidden; }
    
    /* Header Section */
    .header { background-color: var(--wa-header); padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; z-index: 10; height: 65px; box-sizing: border-box; }
    .header-left { display: flex; align-items: center; gap: 12px; flex: 1; }
    .back-icon { color: var(--wa-text); font-size: 20px; cursor: pointer; }
    
    /* Editable Profile Picture */
    .profile-container { position: relative; cursor: pointer; }
    .profile-pic { width: 42px; height: 42px; border-radius: 50%; background-color: #6a7175; display: flex; justify-content: center; align-items: center; color: white; font-size: 20px; overflow: hidden; object-fit: cover; }
    /* Business Badge (Red dot with shop icon inside) */
    .business-badge { position: absolute; bottom: -2px; right: -2px; width: 14px; height: 14px; background-color: #e91e63; border-radius: 50%; border: 2px solid var(--wa-header); display: flex; justify-content: center; align-items: center; }
    .business-badge i { font-size: 8px; color: white; }
    
    /* Editable Header Name */
    .chat-name { font-size: 17px; font-weight: 600; color: var(--wa-text); outline: none; padding: 2px; }
    .header-right { display: flex; align-items: center; gap: 24px; color: var(--wa-text); font-size: 18px; }

    /* Main Chat Background */
    .chat-container { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-repeat: repeat; background-color: var(--wa-bg); background-blend-mode: overlay; opacity: 0.95; }
    
    .date-badge { align-self: center; background-color: #182229; color: var(--wa-text-muted); font-size: 12.5px; padding: 6px 14px; border-radius: 10px; margin-top: 10px; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
    
    .enc-message { align-self: center; background-color: #182229; color: #ffd279; font-size: 12.5px; padding: 8px 12px; border-radius: 8px; text-align: center; max-width: 85%; margin-bottom: 10px; line-height: 1.4; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
    .enc-message i { font-size: 11px; margin-right: 5px; }

    /* Sent Message Bubble */
    .message-row { display: flex; justify-content: flex-end; width: 100%; margin-bottom: 2px; }
    .message-sent { background-color: var(--wa-msg-sent); color: var(--wa-text); padding: 6px 7px 6px 9px; border-radius: 8px 0 8px 8px; max-width: 85%; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,0.1); font-size: 15.5px; line-height: 1.4; word-wrap: break-word; }
    
    /* Open Graph Link Preview Box */
    .link-preview { background-color: #025144; border-radius: 8px; overflow: hidden; margin-bottom: 5px; cursor: pointer; border-left: 4px solid var(--wa-green); }
    .link-image { width: 100%; height: 160px; background-color: #111; display: flex; justify-content: center; align-items: center; overflow: hidden; }
    .link-image img { width: 100%; height: 100%; object-fit: cover; }
    .link-info { padding: 8px 10px; }
    .link-title { font-weight: bold; font-size: 14px; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .link-domain { font-size: 12px; color: #b1c1c8; display: flex; align-items: center; gap: 5px; }
    
    .msg-text a { color: var(--wa-blue-tick); text-decoration: none; }
    .msg-text a:hover { text-decoration: underline; }
    
    .msg-meta { display: flex; justify-content: flex-end; align-items: center; gap: 4px; margin-top: 2px; margin-right: 2px; float: right; margin-left: 15px; }
    .time { font-size: 11px; color: #a4b4bb; margin-top: 2px; }
    .ticks { color: var(--wa-blue-tick); font-size: 12px; }

    /* Exact WhatsApp Bottom Input Area */
    .input-container { background-color: var(--wa-input-bg); padding: 8px; display: flex; align-items: center; gap: 8px; }
    
    .input-box { flex: 1; background-color: var(--wa-input-box); border-radius: 24px; display: flex; align-items: center; padding: 0 10px; min-height: 48px; }
    .input-box i { color: var(--wa-text-muted); font-size: 24px; cursor: pointer; padding: 8px 6px; }
    
    .input-box input { flex: 1; background: transparent; border: none; color: var(--wa-text); font-size: 16px; outline: none; padding: 10px 5px; }
    .input-box input::placeholder { color: var(--wa-text-muted); font-size: 16px; }
    
    /* Dedicated Mic/Send Circle Button outside the input box */
    .send-btn-circle { width: 48px; height: 48px; border-radius: 50%; background-color: var(--wa-green); color: var(--wa-bg); display: flex; justify-content: center; align-items: center; font-size: 20px; border: none; cursor: pointer; flex-shrink: 0; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
    
    /* Loader for URL fetching */
    .loader { border: 2px solid rgba(255,255,255,0.1); border-top: 2px solid var(--wa-green); border-radius: 50%; width: 18px; height: 18px; animation: spin 1s linear infinite; display: none; margin-right: 10px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Hidden File Input for Profile Picture -->
  <input type="file" id="profile-upload" accept="image/*" style="display: none;">

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <i class="fas fa-arrow-left back-icon"></i>
      <!-- Clickable Profile Picture -->
      <div class="profile-container" onclick="document.getElementById('profile-upload').click()">
        <img src="" id="profile-img" class="profile-pic" style="display: none;">
        <div class="profile-pic" id="profile-placeholder"><i class="fas fa-user"></i></div>
        <div class="business-badge"><i class="fas fa-store"></i></div>
      </div>
      <!-- Editable Name/Number -->
      <div class="chat-name" contenteditable="true" spellcheck="false">+91 63072 15940</div>
    </div>
    <div class="header-right">
      <i class="fas fa-video"></i>
      <i class="fas fa-phone-alt"></i>
      <i class="fas fa-ellipsis-v"></i>
    </div>
  </div>

  <!-- Main Chat Area -->
  <div class="chat-container" id="chat-box">
    <div class="date-badge">Today</div>
    <div class="enc-message">
      <i class="fas fa-lock"></i> Messages and calls are end-to-end encrypted. Only people in this chat can read, listen to, or share them. <b>Learn more</b>
    </div>
  </div>

  <!-- Bottom Input Area (Exact Match) -->
  <div class="input-container">
    <div class="input-box">
      <i class="far fa-smile"></i>
      <input type="text" id="msg-input" placeholder="Message" autocomplete="off">
      <div id="loading-spinner" class="loader"></div>
      <i class="fas fa-paperclip" id="attach-icon"></i>
      <i class="fas fa-camera" id="camera-icon"></i>
    </div>
    <!-- Outside Green Circle Button -->
    <button class="send-btn-circle" id="send-btn">
      <i class="fas fa-microphone" id="btn-icon"></i>
    </button>
  </div>

  <script>
    const msgInput = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');
    const btnIcon = document.getElementById('btn-icon');
    const chatBox = document.getElementById('chat-box');
    const attachIcon = document.getElementById('attach-icon');
    const cameraIcon = document.getElementById('camera-icon');
    const spinner = document.getElementById('loading-spinner');
    
    const profileUpload = document.getElementById('profile-upload');
    const profileImg = document.getElementById('profile-img');
    const profilePlaceholder = document.getElementById('profile-placeholder');

    // Handle Profile Picture Upload
    profileUpload.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                profileImg.src = e.target.result;
                profileImg.style.display = "block";
                profilePlaceholder.style.display = "none";
            };
            reader.readAsDataURL(file);
        }
    });

    // Toggle Mic and Send Icon
    msgInput.addEventListener('input', () => {
        if (msgInput.value.trim().length > 0) {
            btnIcon.className = "fas fa-paper-plane";
            attachIcon.style.display = "none";
            cameraIcon.style.display = "none";
        } else {
            btnIcon.className = "fas fa-microphone";
            attachIcon.style.display = "block";
            cameraIcon.style.display = "block";
        }
    });

    // Send on Enter
    msgInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            sendBtn.click();
        }
    });

    // Send Message
    sendBtn.addEventListener('click', async () => {
        const text = msgInput.value.trim();
        if (!text) return; // If clicking mic, do nothing for now

        msgInput.value = "";
        btnIcon.className = "fas fa-microphone";
        attachIcon.style.display = "block";
        cameraIcon.style.display = "block";

        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }).toLowerCase();
        const urlRegex = /(https?:\/\/[^\s]+)/g;
        const urls = text.match(urlRegex);
        
        let previewHTML = "";

        if (urls && urls.length > 0) {
            const link = urls[0];
            spinner.style.display = "block"; 
            
            try {
                // Fetch OG Data using open proxy
                const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(link)}`);
                const data = await response.json();
                
                const parser = new DOMParser();
                const doc = parser.parseFromString(data.contents, "text/html");
                
                const ogImg = doc.querySelector('meta[property="og:image"]')?.content || doc.querySelector('meta[name="twitter:image"]')?.content;
                let ogTitle = doc.querySelector('meta[property="og:title"]')?.content || doc.title || "Link Preview";
                const domain = new URL(link).hostname;

                if (ogImg) {
                    previewHTML = `
                    <div class="link-preview" onclick="window.open('${link}', '_blank')">
                        <div class="link-image">
                            <img src="${ogImg}" alt="Preview" onerror="this.parentElement.style.display='none'">
                        </div>
                        <div class="link-info">
                            <div class="link-title">${ogTitle}</div>
                            <div class="link-domain"><i class="fas fa-link"></i> ${domain}</div>
                        </div>
                    </div>`;
                }
            } catch (error) {
                console.log("No preview found");
            }
            spinner.style.display = "none";
        }

        let formattedText = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
        formattedText = formattedText.replace(urlRegex, '<a href="$1" target="_blank">$1</a>');
        formattedText = formattedText.replace(/\n/g, '<br>');

        const msgHTML = `
        <div class="message-row">
            <div class="message-sent">
                ${previewHTML}
                <div class="msg-text">${formattedText}</div>
                <div class="msg-meta">
                    <span class="time">${time}</span>
                    <span class="ticks"><i class="fas fa-check-double"></i></span>
                </div>
            </div>
        </div>`;

        chatBox.insertAdjacentHTML('beforeend', msgHTML);
        chatBox.scrollTop = chatBox.scrollHeight;
    });

  </script>
</body>
</html>
