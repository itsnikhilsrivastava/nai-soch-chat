<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1f2c34">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="display" content="standalone">
  
  <title>WhatsApp</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --wa-bg: #0b141a;
      --wa-header: #1f2c34;
      --wa-input-box: #1f2c34;
      --wa-msg-sent: #005c4b;
      --wa-text: #e9edef;
      --wa-text-muted: #8696a0;
      --wa-green: #00a884;
      --wa-blue-tick: #53bdeb;
      --wa-system-msg-bg: #182229;
      --wa-system-msg-text: #ffd279;
      --wa-link-bg: #025144;
    }
    
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    body, html { 
      font-family: 'Helvetica Neue', Helvetica, 'Segoe UI', Tahoma, Arial, sans-serif; 
      margin: 0; 
      padding: 0; 
      background-color: var(--wa-bg); 
      display: flex; 
      flex-direction: column; 
      height: 100dvh; 
      width: 100%; /* Changed from 100vw to fix mic cutoff */
      overflow-x: hidden; /* Prevents horizontal scroll */
      color: var(--wa-text); 
      overflow-y: hidden; 
    }
    
    /* Header Section */
    .header { 
      background-color: var(--wa-header); 
      padding: 10px 15px; 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      z-index: 10; 
      height: 60px; 
      flex-shrink: 0;
      width: 100%;
    }
    .header-left { display: flex; align-items: center; gap: 8px; flex: 1; overflow: hidden; }
    .back-icon { color: var(--wa-text); font-size: 18px; cursor: pointer; padding-right: 4px; }
    
    .profile-container { position: relative; cursor: pointer; flex-shrink: 0; }
    .profile-pic { 
      width: 40px; 
      height: 40px; 
      border-radius: 50%; 
      background-color: #6a7175; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      color: #cfd4d6; 
      font-size: 22px; 
      overflow: hidden; 
      object-fit: cover; 
    }
    
    .chat-name { 
      font-size: 16.5px; 
      font-weight: 500; 
      color: var(--wa-text); 
      outline: none; 
      padding: 2px; 
      letter-spacing: 0.3px; 
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .header-right { display: flex; align-items: center; gap: 24px; color: var(--wa-text); flex-shrink: 0; }
    .header-right svg { cursor: pointer; }

    /* Main Chat Background */
    .chat-wrapper {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      background-color: var(--wa-bg);
      overflow: hidden;
      width: 100%;
    }

    .chat-wrapper::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
      background-repeat: repeat;
      opacity: 0.07; 
      z-index: 1;
      pointer-events: none;
    }

    .chat-container { 
      flex: 1; 
      padding: 15px; 
      overflow-y: auto; 
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
      z-index: 2;
    }
    
    .date-badge { align-self: center; background-color: var(--wa-system-msg-bg); color: var(--wa-text-muted); font-size: 12px; padding: 6px 12px; border-radius: 8px; margin-top: 5px; }
    .enc-message { align-self: center; background-color: var(--wa-system-msg-bg); color: var(--wa-system-msg-text); font-size: 12px; padding: 8px 12px; border-radius: 8px; text-align: center; max-width: 90%; margin-bottom: 8px; line-height: 1.4; }
    .enc-message i { font-size: 10px; margin-right: 4px; }
    .enc-message b { color: var(--wa-system-msg-text); font-weight: 500; cursor: pointer; }

    .message-row { display: flex; justify-content: flex-end; width: 100%; margin-bottom: 2px; }
    .message-sent { background-color: var(--wa-msg-sent); color: var(--wa-text); padding: 6px 8px 8px 10px; border-radius: 8px 0 8px 8px; max-width: 85%; position: relative; font-size: 15px; line-height: 1.4; word-wrap: break-word; box-shadow: 0 1px 0.5px rgba(0,0,0,0.13); }
    
    .msg-meta { float: right; display: flex; align-items: center; gap: 4px; margin-top: 4px; margin-left: 10px; margin-bottom: -4px; }
    .time { font-size: 11px; color: rgba(255,255,255,0.6); }
    .ticks { color: var(--wa-blue-tick); font-size: 13px; }
    .ticks.single { color: rgba(255,255,255,0.6); }

    /* Bottom Input Area Fixed */
    .input-container { 
      background-color: transparent; 
      padding: 5px 8px; 
      display: flex; 
      align-items: flex-end; 
      gap: 8px; 
      z-index: 10;
      width: 100%;
      flex-shrink: 0;
      padding-bottom: max(8px, env(safe-area-inset-bottom));
      box-sizing: border-box; /* Ensures padding doesn't push it out */
    }
    
    .input-box { flex: 1; background-color: var(--wa-input-box); border-radius: 24px; display: flex; align-items: flex-end; padding: 10px 12px; min-height: 48px; box-sizing: border-box; }
    .input-box i { color: var(--wa-text-muted); font-size: 22px; cursor: pointer; padding: 2px 6px; }
    
    .input-box textarea { flex: 1; background: transparent; border: none; color: var(--wa-text); font-size: 16px; outline: none; padding: 2px 8px; resize: none; max-height: 120px; font-family: inherit; line-height: 20px; overflow-y: auto; }
    .input-box textarea::placeholder { color: var(--wa-text-muted); font-size: 16px; }
    
    .send-btn-circle { 
      width: 48px; 
      height: 48px; 
      border-radius: 50%; 
      background-color: #ffffff; 
      color: #111b21; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      font-size: 20px; 
      border: none; 
      cursor: pointer; 
      flex-shrink: 0; 
      box-shadow: 0 1px 2px rgba(0,0,0,0.2); 
      transition: background-color 0.2s, color 0.2s;
    }
    
    .send-btn-circle.typing { background-color: var(--wa-green); color: #ffffff; }
  </style>
</head>
<body>
  <input type="file" id="profile-upload" accept="image/*" style="display: none;">

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <i class="fas fa-arrow-left back-icon"></i>
      <div class="profile-container" onclick="document.getElementById('profile-upload').click()">
        <img src="" id="profile-img" class="profile-pic" style="display: none;">
        <div class="profile-pic" id="profile-placeholder"><i class="fas fa-user" style="font-size: 20px;"></i></div>
      </div>
      <div class="chat-name" contenteditable="true" spellcheck="false">+91 63072 15940</div>
    </div>
    
    <!-- SVGs for Video, Phone, and Menu -->
    <div class="header-right">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
        <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
      </svg>
      <svg viewBox="0 0 24 24" width="21" height="21" fill="currentColor">
        <path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 00-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/>
      </svg>
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
        <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
      </svg>
    </div>
  </div>

  <div class="chat-wrapper">
    <div class="chat-container" id="chat-box">
      <div class="date-badge">Today</div>
      <div class="enc-message">
        <i class="fas fa-lock"></i> Messages and calls are end-to-end encrypted. Only people in this chat can read, listen to, or share them. <b>Learn more</b>
      </div>
    </div>
  </div>

  <div class="input-container">
    <div class="input-box">
      <i class="far fa-smile"></i>
      <textarea id="msg-input" placeholder="Message" rows="1"></textarea>
      <i class="fas fa-paperclip" id="attach-icon"></i>
      <i class="fas fa-camera" id="camera-icon"></i>
    </div>
    <button class="send-btn-circle" id="send-btn">
      <i class="fas fa-microphone" id="btn-icon"></i>
    </button>
  </div>

  <script>
    // --- PWA Service Worker Registration ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then(reg => {
          console.log('Service Worker Registered');
        }).catch(err => {
          console.log('Service Worker registration failed: ', err);
        });
      });
    }

    // --- Chat Logic ---
    const msgInput = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');
    const btnIcon = document.getElementById('btn-icon');
    const chatBox = document.getElementById('chat-box');
    const attachIcon = document.getElementById('attach-icon');
    const cameraIcon = document.getElementById('camera-icon');
    
    const profileUpload = document.getElementById('profile-upload');
    const profileImg = document.getElementById('profile-img');
    const profilePlaceholder = document.getElementById('profile-placeholder');

    msgInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight) + 'px';
        if (this.value.trim().length > 0) {
            btnIcon.className = "fas fa-paper-plane";
            sendBtn.classList.add("typing");
            attachIcon.style.display = "none";
            cameraIcon.style.display = "none";
        } else {
            btnIcon.className = "fas fa-microphone";
            sendBtn.classList.remove("typing");
            attachIcon.style.display = "block";
            cameraIcon.style.display = "block";
            this.style.height = 'auto';
        }
    });

    profileUpload.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                profileImg.src = e.target.result;
                profileImg.style.display = "block";
                profilePlaceholder.style.display = "none";
            };
            reader.readAsDataURL(file);
        }
    });

    msgInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendBtn.click();
        }
    });

    sendBtn.addEventListener('click', () => {
        const text = msgInput.value.trim();
        if (!text) return;

        msgInput.value = "";
        msgInput.style.height = 'auto';
        btnIcon.className = "fas fa-microphone";
        sendBtn.classList.remove("typing");
        attachIcon.style.display = "block";
        cameraIcon.style.display = "block";

        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }).toLowerCase();
        let formattedText = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
        const urlRegex = /(https?:\/\/[^\s]+)/g;
        formattedText = formattedText.replace(urlRegex, '<a href="$1" target="_blank">$1</a>');
        formattedText = formattedText.replace(/\n/g, '<br>');

        const msgHTML = `
        <div class="message-row">
            <div class="message-sent">
                <span class="msg-text">${formattedText}</span>
                <div class="msg-meta">
                    <span class="time">${time}</span>
                    <span class="ticks single"><i class="fas fa-check"></i></span>
                </div>
            </div>
        </div>`;

        chatBox.insertAdjacentHTML('beforeend', msgHTML);
        chatBox.scrollTop = chatBox.scrollHeight;
        
        setTimeout(() => {
            const lastMsg = chatBox.lastElementChild;
            const ticks = lastMsg.querySelector('.ticks');
            if(ticks) {
                ticks.classList.remove('single');
                ticks.innerHTML = '<i class="fas fa-check-double"></i>';
            }
        }, 1500);
    });
  </script>
</body>
</html>
