<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WhatsApp Chat Clone</title>
  <!-- FontAwesome Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --wa-bg: #0b141a;
      --wa-header: #202c33;
      --wa-input-bg: #202c33;
      --wa-input-box: #2a3942;
      --wa-msg-sent: #005c4b;
      --wa-text: #e9edef;
      --wa-text-muted: #8696a0;
      --wa-green: #00a884;
      --wa-blue-tick: #53bdeb;
      --wa-system-msg-bg: #182229;
      --wa-system-msg-text: #ffd279;
      --wa-link-bg: #025144;
    }
    
    body { 
      font-family: 'Helvetica Neue', Helvetica, 'Segoe UI', Tahoma, Arial, sans-serif; 
      margin: 0; 
      padding: 0; 
      background-color: var(--wa-bg); 
      display: flex; 
      flex-direction: column; 
      height: 100dvh; 
      color: var(--wa-text); 
      overflow: hidden; 
    }
    
    /* Header Section */
    .header { 
      background-color: var(--wa-header); 
      padding: 10px 15px; 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      z-index: 10; 
      height: 60px; 
      box-sizing: border-box; 
    }
    .header-left { display: flex; align-items: center; gap: 8px; flex: 1; }
    .back-icon { color: var(--wa-text); font-size: 18px; cursor: pointer; padding-right: 4px; }
    
    /* Editable Profile Picture */
    .profile-container { position: relative; cursor: pointer; }
    .profile-pic { 
      width: 40px; 
      height: 40px; 
      border-radius: 50%; 
      background-color: #6a7175; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      color: #cfd4d6; 
      font-size: 22px; 
      overflow: hidden; 
      object-fit: cover; 
    }
    /* Business Badge */
    .business-badge { 
      position: absolute; 
      bottom: -2px; 
      right: -2px; 
      width: 14px; 
      height: 14px; 
      background-color: #e91e63; 
      border-radius: 50%; 
      border: 2px solid var(--wa-header); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
    }
    .business-badge i { font-size: 8px; color: white; }
    
    /* Editable Header Name */
    .chat-name { font-size: 16px; font-weight: 500; color: var(--wa-text); outline: none; padding: 2px; letter-spacing: 0.3px; }
    .header-right { display: flex; align-items: center; gap: 22px; color: var(--wa-text); font-size: 18px; }

    /* Main Chat Background */
    .chat-wrapper {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      background-color: var(--wa-bg);
      overflow: hidden;
    }

    .chat-wrapper::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
      background-repeat: repeat;
      opacity: 0.06; /* Gives the exact dark WhatsApp pattern look */
      z-index: 1;
    }

    .chat-container { 
      flex: 1; 
      padding: 15px; 
      overflow-y: auto; 
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
      z-index: 2;
    }
    
    .date-badge { 
      align-self: center; 
      background-color: var(--wa-system-msg-bg); 
      color: var(--wa-text-muted); 
      font-size: 12px; 
      padding: 6px 12px; 
      border-radius: 8px; 
      margin-top: 5px; 
    }
    
    .enc-message { 
      align-self: center; 
      background-color: var(--wa-system-msg-bg); 
      color: var(--wa-system-msg-text); 
      font-size: 12px; 
      padding: 8px 12px; 
      border-radius: 8px; 
      text-align: center; 
      max-width: 85%; 
      margin-bottom: 8px; 
      line-height: 1.4; 
    }
    .enc-message i { font-size: 10px; margin-right: 4px; }
    .enc-message b { color: var(--wa-system-msg-text); font-weight: 500; cursor: pointer; }

    /* Sent Message Bubble */
    .message-row { display: flex; justify-content: flex-end; width: 100%; margin-bottom: 2px; }
    .message-sent { 
      background-color: var(--wa-msg-sent); 
      color: var(--wa-text); 
      padding: 6px 8px 8px 10px; 
      border-radius: 8px 0 8px 8px; 
      max-width: 85%; 
      position: relative; 
      font-size: 15px; 
      line-height: 1.4; 
      word-wrap: break-word; 
      box-shadow: 0 1px 0.5px rgba(0,0,0,0.13);
    }
    
    /* Open Graph Link Preview Box */
    .link-preview { 
      background-color: var(--wa-link-bg); 
      border-radius: 8px; 
      overflow: hidden; 
      margin-bottom: 6px; 
      cursor: pointer; 
      display: flex;
      flex-direction: column;
    }
    .link-image { width: 100%; background-color: #111; display: flex; justify-content: center; align-items: center; overflow: hidden; }
    .link-image img { width: 100%; max-height: 200px; object-fit: cover; display: block; }
    .link-info { padding: 8px 10px; }
    .link-title { font-weight: 500; font-size: 14px; margin-bottom: 4px; color: #fff; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .link-domain { font-size: 12px; color: #b1c1c8; display: flex; align-items: center; gap: 5px; }
    
    .msg-text { margin-bottom: 2px; }
    .msg-text a { color: var(--wa-blue-tick); text-decoration: none; }
    .msg-text a:hover { text-decoration: underline; }
    
    .msg-meta { 
      float: right;
      display: flex; 
      align-items: center; 
      gap: 4px; 
      margin-top: 4px; 
      margin-left: 10px;
      margin-bottom: -4px; /* Pulls time to the bottom corner perfectly */
    }
    .time { font-size: 11px; color: rgba(255,255,255,0.6); }
    .ticks { color: var(--wa-blue-tick); font-size: 13px; }
    .ticks.single { color: rgba(255,255,255,0.6); }

    /* Exact WhatsApp Bottom Input Area */
    .input-container { 
      background-color: var(--wa-input-bg); 
      padding: 6px 10px; 
      display: flex; 
      align-items: flex-end; 
      gap: 8px; 
      z-index: 10;
    }
    
    .input-box { 
      flex: 1; 
      background-color: var(--wa-input-box); 
      border-radius: 24px; 
      display: flex; 
      align-items: flex-end; 
      padding: 8px 12px; 
      min-height: 48px; 
      box-sizing: border-box;
    }
    .input-box i { color: var(--wa-text-muted); font-size: 22px; cursor: pointer; padding: 4px 6px; }
    
    .input-box textarea { 
      flex: 1; 
      background: transparent; 
      border: none; 
      color: var(--wa-text); 
      font-size: 16px; 
      outline: none; 
      padding: 5px 8px; 
      resize: none;
      max-height: 100px;
      font-family: inherit;
      line-height: 20px;
    }
    .input-box textarea::placeholder { color: var(--wa-text-muted); font-size: 16px; }
    
    /* Dedicated Mic/Send Circle Button */
    .send-btn-circle { 
      width: 48px; 
      height: 48px; 
      border-radius: 50%; 
      background-color: var(--wa-green); 
      color: #111b21; /* Dark icon inside green button */
      display: flex; 
      justify-content: center; 
      align-items: center; 
      font-size: 20px; 
      border: none; 
      cursor: pointer; 
      flex-shrink: 0; 
    }
    
    /* Loader for URL fetching */
    .loader { border: 2px solid rgba(255,255,255,0.1); border-top: 2px solid var(--wa-green); border-radius: 50%; width: 18px; height: 18px; animation: spin 1s linear infinite; display: none; margin-right: 10px; align-self: center; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Hidden File Input for Profile Picture -->
  <input type="file" id="profile-upload" accept="image/*" style="display: none;">

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <i class="fas fa-arrow-left back-icon"></i>
      <!-- Clickable Profile Picture -->
      <div class="profile-container" onclick="document.getElementById('profile-upload').click()">
        <img src="" id="profile-img" class="profile-pic" style="display: none;">
        <div class="profile-pic" id="profile-placeholder"><i class="fas fa-user" style="font-size: 20px;"></i></div>
        <div class="business-badge"><i class="fas fa-store"></i></div>
      </div>
      <!-- Editable Name/Number -->
      <div class="chat-name" contenteditable="true" spellcheck="false">+91 63072 15940</div>
    </div>
    <div class="header-right">
      <i class="fas fa-video"></i>
      <i class="fas fa-phone-alt"></i>
      <i class="fas fa-ellipsis-v" style="font-size: 19px; padding-right: 5px;"></i>
    </div>
  </div>

  <!-- Main Chat Area -->
  <div class="chat-wrapper">
    <div class="chat-container" id="chat-box">
      <div class="date-badge">Today</div>
      <div class="enc-message">
        <i class="fas fa-lock"></i> Messages and calls are end-to-end encrypted. Only people in this chat can read, listen to, or share them. <b>Learn more</b>
      </div>
    </div>
  </div>

  <!-- Bottom Input Area -->
  <div class="input-container">
    <div class="input-box">
      <i class="far fa-smile"></i>
      <textarea id="msg-input" placeholder="Message" rows="1"></textarea>
      <div id="loading-spinner" class="loader"></div>
      <i class="fas fa-paperclip" id="attach-icon"></i>
      <i class="fas fa-camera" id="camera-icon"></i>
    </div>
    <button class="send-btn-circle" id="send-btn">
      <i class="fas fa-microphone" id="btn-icon"></i>
    </button>
  </div>

  <script>
    const msgInput = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');
    const btnIcon = document.getElementById('btn-icon');
    const chatBox = document.getElementById('chat-box');
    const attachIcon = document.getElementById('attach-icon');
    const cameraIcon = document.getElementById('camera-icon');
    const spinner = document.getElementById('loading-spinner');
    
    const profileUpload = document.getElementById('profile-upload');
    const profileImg = document.getElementById('profile-img');
    const profilePlaceholder = document.getElementById('profile-placeholder');

    // Auto-resize textarea
    msgInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight) + 'px';
        
        // Toggle Mic and Send Icon
        if (this.value.trim().length > 0) {
            btnIcon.className = "fas fa-paper-plane";
            attachIcon.style.display = "none";
            cameraIcon.style.display = "none";
        } else {
            btnIcon.className = "fas fa-microphone";
            attachIcon.style.display = "block";
            cameraIcon.style.display = "block";
            this.style.height = 'auto';
        }
    });

    // Handle Profile Picture Upload
    profileUpload.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                profileImg.src = e.target.result;
                profileImg.style.display = "block";
                profilePlaceholder.style.display = "none";
            };
            reader.readAsDataURL(file);
        }
    });

    // Send on Enter (Prevent default new line behavior if shift isn't pressed)
    msgInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendBtn.click();
        }
    });

    // Send Message
    sendBtn.addEventListener('click', async () => {
        const text = msgInput.value.trim();
        if (!text) return;

        msgInput.value = "";
        msgInput.style.height = 'auto';
        btnIcon.className = "fas fa-microphone";
        attachIcon.style.display = "block";
        cameraIcon.style.display = "block";

        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }).toLowerCase();
        const urlRegex = /(https?:\/\/[^\s]+)/g;
        const urls = text.match(urlRegex);
        
        let previewHTML = "";

        if (urls && urls.length > 0) {
            const link = urls[0];
            spinner.style.display = "block"; 
            
            try {
                const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(link)}`);
                const data = await response.json();
                
                const parser = new DOMParser();
                const doc = parser.parseFromString(data.contents, "text/html");
                
                const ogImg = doc.querySelector('meta[property="og:image"]')?.content || doc.querySelector('meta[name="twitter:image"]')?.content;
                let ogTitle = doc.querySelector('meta[property="og:title"]')?.content || doc.title || "Link Preview";
                const domain = new URL(link).hostname;

                if (ogImg) {
                    previewHTML = `
                    <div class="link-preview" onclick="window.open('${link}', '_blank')">
                        <div class="link-image">
                            <img src="${ogImg}" alt="Preview" onerror="this.parentElement.style.display='none'">
                        </div>
                        <div class="link-info">
                            <div class="link-title">${ogTitle}</div>
                            <div class="link-domain"><i class="fas fa-link"></i> ${domain}</div>
                        </div>
                    </div>`;
                }
            } catch (error) {
                console.log("No preview found");
            }
            spinner.style.display = "none";
        }

        let formattedText = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
        formattedText = formattedText.replace(urlRegex, '<a href="$1" target="_blank">$1</a>');
        formattedText = formattedText.replace(/\n/g, '<br>');

        const msgHTML = `
        <div class="message-row">
            <div class="message-sent">
                ${previewHTML}
                <span class="msg-text">${formattedText}</span>
                <div class="msg-meta">
                    <span class="time">${time}</span>
                    <span class="ticks single"><i class="fas fa-check"></i></span>
                </div>
            </div>
        </div>`;

        chatBox.insertAdjacentHTML('beforeend', msgHTML);
        chatBox.scrollTop = chatBox.scrollHeight;
        
        // Simulate changing tick to double tick after a delay for realism
        setTimeout(() => {
            const lastMsg = chatBox.lastElementChild;
            const ticks = lastMsg.querySelector('.ticks');
            if(ticks) {
                ticks.classList.remove('single');
                ticks.innerHTML = '<i class="fas fa-check-double"></i>';
            }
        }, 1500);
    });

  </script>
</body>
</html>
