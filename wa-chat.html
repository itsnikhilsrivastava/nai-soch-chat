<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>WhatsApp Chat</title>
  
  <!-- FontAwesome Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --wa-bg: #0b141a;
      --wa-header: #1f2c34;
      --wa-input-box: #1f2c34;
      --wa-msg-sent: #005c4b;
      --wa-text: #e9edef;
      --wa-text-muted: #8696a0;
      --wa-green: #00a884;
      --wa-blue-tick: #53bdeb;
      --wa-system-msg-bg: #182229;
      --wa-system-msg-text: #ffd279;
      --wa-link-bg: #025144;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    
    body, html { 
      font-family: 'Helvetica Neue', Helvetica, 'Segoe UI', Tahoma, Arial, sans-serif; 
      background-color: var(--wa-bg); 
      display: flex; 
      flex-direction: column; 
      height: 100dvh; 
      width: 100%; 
      max-width: 100vw;
      overflow: hidden; 
      color: var(--wa-text); 
    }

    /* Fake Status Bar */
    .fake-status-bar {
      background-color: #0b141a;
      color: #e9edef;
      height: 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      font-size: 13px;
      font-weight: 500;
      flex-shrink: 0;
      z-index: 20;
    }
    .status-right {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }
    
    /* Header Section */
    .header { 
      background-color: var(--wa-header); 
      padding: 10px 15px; 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      z-index: 10; 
      height: 60px; 
      flex-shrink: 0;
      width: 100%;
    }
    .header-left { display: flex; align-items: center; gap: 8px; flex: 1; overflow: hidden; }
    .back-icon { color: var(--wa-text); font-size: 18px; cursor: pointer; padding-right: 4px; }
    
    .profile-container { position: relative; cursor: pointer; flex-shrink: 0; }
    .profile-pic { 
      width: 40px; 
      height: 40px; 
      border-radius: 50%; 
      background-color: #6a7175; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      color: #cfd4d6; 
      font-size: 22px; 
      overflow: hidden; 
      object-fit: cover; 
    }
    
    .chat-name { 
      font-size: 16.5px; 
      font-weight: 500; 
      color: var(--wa-text); 
      outline: none; 
      padding: 2px; 
      letter-spacing: 0.3px; 
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .header-right { display: flex; align-items: center; gap: 24px; color: var(--wa-text); flex-shrink: 0; }
    .header-right svg { cursor: pointer; }

    /* Main Chat Background */
    .chat-wrapper {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      background-color: var(--wa-bg);
      overflow: hidden;
      width: 100%;
    }

    .chat-wrapper::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
      background-repeat: repeat;
      opacity: 0.07; 
      z-index: 1;
      pointer-events: none;
    }

    .chat-container { 
      flex: 1; 
      padding: 15px; 
      overflow-y: auto; 
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
      z-index: 2;
    }
    
    .date-badge { align-self: center; background-color: var(--wa-system-msg-bg); color: var(--wa-text-muted); font-size: 12px; padding: 6px 12px; border-radius: 8px; margin-top: 5px; }
    
    /* Hidden Share Button (Disguised as Encryption Notice) */
    .enc-message { 
      align-self: center; 
      background-color: var(--wa-system-msg-bg); 
      color: var(--wa-system-msg-text); 
      font-size: 12px; 
      padding: 8px 12px; 
      border-radius: 8px; 
      text-align: center; 
      max-width: 90%; 
      margin-bottom: 8px; 
      line-height: 1.4; 
      cursor: pointer;
      border: 1px dashed transparent;
      transition: border-color 0.2s;
    }
    .enc-message:hover { border-color: var(--wa-system-msg-text); }
    .enc-message i { font-size: 10px; margin-right: 4px; }
    .enc-message b { color: var(--wa-system-msg-text); font-weight: 500; }

    /* Message Bubbles */
    .message-row { display: flex; justify-content: flex-end; width: 100%; margin-bottom: 2px; }
    .message-sent { background-color: var(--wa-msg-sent); color: var(--wa-text); padding: 6px 8px 8px 10px; border-radius: 8px 0 8px 8px; max-width: 85%; position: relative; font-size: 15px; line-height: 1.4; word-wrap: break-word; box-shadow: 0 1px 0.5px rgba(0,0,0,0.13); }
    
    .msg-meta { float: right; display: flex; align-items: center; gap: 4px; margin-top: 4px; margin-left: 10px; margin-bottom: -4px; }
    .time { font-size: 11px; color: rgba(255,255,255,0.6); }
    
    .ticks { 
      cursor: pointer; 
      font-size: 13px; 
      display: inline-flex; 
      align-items: center; 
      padding: 2px;
    }
    .ticks.state-single, .ticks.state-double-grey { color: rgba(255,255,255,0.6); }
    .ticks.state-blue { color: var(--wa-blue-tick); }

    /* Link Preview */
    .link-preview { background-color: var(--wa-link-bg); border-radius: 8px; overflow: hidden; margin-bottom: 6px; cursor: pointer; display: flex; flex-direction: column; }
    .link-image { width: 100%; background-color: #111; display: flex; justify-content: center; align-items: center; overflow: hidden; }
    .link-image img { width: 100%; max-height: 200px; object-fit: cover; display: block; }
    .link-info { padding: 8px 10px; }
    .link-title { font-weight: 500; font-size: 14px; margin-bottom: 4px; color: #fff; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .link-domain { font-size: 12px; color: #b1c1c8; display: flex; align-items: center; gap: 5px; }
    .msg-text a { color: var(--wa-blue-tick); text-decoration: none; }
    .msg-text a:hover { text-decoration: underline; }

    /* Bottom Input Area */
    .input-container { 
      background-color: transparent; 
      padding: 5px 8px; 
      display: flex; 
      align-items: flex-end; 
      gap: 8px; 
      z-index: 10;
      width: 100%;
      flex-shrink: 0;
      padding-bottom: max(8px, env(safe-area-inset-bottom));
    }
    
    .input-box { 
      flex: 1; 
      min-width: 0; 
      background-color: var(--wa-input-box); 
      border-radius: 24px; 
      display: flex; 
      align-items: flex-end; 
      padding: 10px 12px; 
      min-height: 48px; 
    }
    .input-box i { color: var(--wa-text-muted); font-size: 22px; cursor: pointer; padding: 2px 6px; }
    
    .input-box textarea { 
      flex: 1; 
      min-width: 0; 
      background: transparent; 
      border: none; 
      color: var(--wa-text); 
      font-size: 16px; 
      outline: none; 
      padding: 2px 8px; 
      resize: none; 
      max-height: 120px; 
      font-family: inherit; 
      line-height: 20px; 
      overflow-y: auto; 
    }
    .input-box textarea::placeholder { color: var(--wa-text-muted); font-size: 16px; }
    
    .send-btn-circle { 
      width: 48px; 
      height: 48px; 
      border-radius: 50%; 
      background-color: #ffffff; 
      color: #111b21; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      font-size: 20px; 
      border: none; 
      cursor: pointer; 
      flex-shrink: 0; 
      box-shadow: 0 1px 2px rgba(0,0,0,0.2); 
      transition: background-color 0.2s, color 0.2s;
    }
    
    .send-btn-circle.typing { background-color: var(--wa-green); color: #ffffff; }

    /* Loader */
    .loader { border: 2px solid rgba(255,255,255,0.1); border-top: 2px solid var(--wa-green); border-radius: 50%; width: 18px; height: 18px; animation: spin 1s linear infinite; display: none; margin-right: 10px; align-self: center; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Fake Status Bar -->
  <div class="fake-status-bar">
    <span id="live-clock">12:14</span>
    <div class="status-right">
      <i class="fas fa-signal" style="font-size: 11px;"></i>
      <i class="fas fa-wifi" style="font-size: 11px;"></i>
      <span>59%</span>
      <i class="fas fa-battery-three-quarters" style="font-size: 12px;"></i>
    </div>
  </div>

  <input type="file" id="profile-upload" accept="image/*" style="display: none;">

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <i class="fas fa-arrow-left back-icon"></i>
      <div class="profile-container" onclick="document.getElementById('profile-upload').click()">
        <img src="" id="profile-img" class="profile-pic" style="display: none;">
        <div class="profile-pic" id="profile-placeholder"><i class="fas fa-user" style="font-size: 20px;"></i></div>
      </div>
      <div class="chat-name" contenteditable="true" spellcheck="false">+91 63072 15940</div>
    </div>
    
    <div class="header-right">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
        <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
      </svg>
      <svg viewBox="0 0 24 24" width="21" height="21" fill="currentColor">
        <path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 00-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/>
      </svg>
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
        <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
      </svg>
    </div>
  </div>

  <!-- Chat Area -->
  <div class="chat-wrapper">
    <div class="chat-container" id="chat-box">
      <div class="date-badge">Today</div>
      <!-- Hidden Share Trigger on Encryption Message -->
      <div class="enc-message" id="share-trigger" title="Click to copy shareable chat link">
        <i class="fas fa-lock"></i> Messages and calls are end-to-end encrypted. Only people in this chat can read, listen to, or share them. <b>Learn more</b>
      </div>
    </div>
  </div>

  <!-- Bottom Input Area -->
  <div class="input-container">
    <div class="input-box">
      <i class="far fa-smile"></i>
      <textarea id="msg-input" placeholder="Message" rows="1"></textarea>
      <div id="loading-spinner" class="loader"></div>
      <i class="fas fa-paperclip" id="attach-icon"></i>
      <i class="fas fa-camera" id="camera-icon"></i>
    </div>
    <button class="send-btn-circle" id="send-btn">
      <i class="fas fa-microphone" id="btn-icon"></i>
    </button>
  </div>

  <script>
    // --- Live Clock ---
    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      let minutes = now.getMinutes();
      minutes = minutes < 10 ? '0' + minutes : minutes;
      document.getElementById('live-clock').innerText = hours + ':' + minutes;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- Load Chat from URL Hash if shared ---
    window.addEventListener('DOMContentLoaded', () => {
      const hash = window.location.hash;
      if (hash && hash.startsWith('#chat=')) {
        try {
          const encodedData = hash.replace('#chat=', '');
          const decodedHtml = decodeURIComponent(atob(encodedData));
          // Keep the date-badge and enc-message, append shared rows
          const chatBox = document.getElementById('chat-box');
          chatBox.insertAdjacentHTML('beforeend', decodedHtml);
        } catch(e) {
          console.log("Could not load shared chat");
        }
      }
    });

    // --- Hidden Share Link Generator (Clicking Encryption Banner) ---
    document.getElementById('share-trigger').addEventListener('click', () => {
      const chatBox = document.getElementById('chat-box');
      // Clone chatBox and remove the encryption banner from shared payload
      const clone = chatBox.cloneNode(true);
      const encMsg = clone.querySelector('.enc-message');
      if(encMsg) encMsg.remove();
      const dateBadge = clone.querySelector('.date-badge');
      if(dateBadge) dateBadge.remove();

      const chatHtml = clone.innerHTML;
      const encodedData = btoa(encodeURIComponent(chatHtml));
      const shareUrl = window.location.origin + window.location.pathname + '#chat=' + encodedData;

      navigator.clipboard.writeText(shareUrl).then(() => {
        alert('शेयर लिंक कॉपी हो गया है! अब इसे किसी भी ब्राउज़र में खोलेंगे तो पूरी चैट दिखेगी।');
      }).catch(err => {
        prompt('इस लिंक को कॉपी कर लें:', shareUrl);
      });
    });

    // --- Chat Logic ---
    const msgInput = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');
    const btnIcon = document.getElementById('btn-icon');
    const chatBox = document.getElementById('chat-box');
    const attachIcon = document.getElementById('attach-icon');
    const cameraIcon = document.getElementById('camera-icon');
    const spinner = document.getElementById('loading-spinner');
    
    const profileUpload = document.getElementById('profile-upload');
    const profileImg = document.getElementById('profile-img');
    const profilePlaceholder = document.getElementById('profile-placeholder');

    msgInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight) + 'px';
        
        if (this.value.trim().length > 0) {
            btnIcon.className = "fas fa-paperplane";
            sendBtn.classList.add("typing");
            attachIcon.style.display = "none";
            cameraIcon.style.display = "none";
        } else {
            btnIcon.className = "fas fa-microphone";
            sendBtn.classList.remove("typing");
            attachIcon.style.display = "block";
            cameraIcon.style.display = "block";
            this.style.height = 'auto';
        }
    });

    profileUpload.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                profileImg.src = e.target.result;
                profileImg.style.display = "block";
                profilePlaceholder.style.display = "none";
            };
            reader.readAsDataURL(file);
        }
    });

    msgInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendBtn.click();
        }
    });

    // Interactive Ticks Changer
    chatBox.addEventListener('click', (e) => {
        const ticksEl = e.target.closest('.ticks');
        if (!ticksEl) return;

        if (ticksEl.classList.contains('state-single')) {
            ticksEl.classList.remove('state-single');
            ticksEl.classList.add('state-double-grey');
            ticksEl.innerHTML = '<i class="fas fa-check-double"></i>';
        } else if (ticksEl.classList.contains('state-double-grey')) {
            ticksEl.classList.remove('state-double-grey');
            ticksEl.classList.add('state-blue');
            ticksEl.innerHTML = '<i class="fas fa-check-double"></i>';
        } else {
            ticksEl.classList.remove('state-blue');
            ticksEl.classList.add('state-single');
            ticksEl.innerHTML = '<i class="fas fa-check"></i>';
        }
    });

    sendBtn.addEventListener('click', async () => {
        const text = msgInput.value.trim();
        if (!text) return;

        msgInput.value = "";
        msgInput.style.height = 'auto';
        btnIcon.className = "fas fa-microphone";
        sendBtn.classList.remove("typing");
        attachIcon.style.display = "block";
        cameraIcon.style.display = "block";

        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }).toLowerCase();
        const urlRegex = /(https?:\/\/[^\s]+)/g;
        const urls = text.match(urlRegex);
        
        let previewHTML = "";

        if (urls && urls.length > 0) {
            const link = urls[0];
            spinner.style.display = "block"; 
            
            let htmlData = null;
            const proxies = [
                `https://api.allorigins.win/get?url=${encodeURIComponent(link)}`,
                `https://api.codetabs.com/v1/proxy?url=${encodeURIComponent(link)}`
            ];

            for (let proxyUrl of proxies) {
                try {
                    const response = await fetch(proxyUrl);
                    if (proxyUrl.includes('allorigins')) {
                        const data = await response.json();
                        if (data && data.contents) {
                            htmlData = data.contents;
                            break;
                        }
                    } else {
                        const textData = await response.text();
                        if (textData) {
                            htmlData = textData;
                            break;
                        }
                    }
                } catch (err) {
                    console.log("Proxy failed");
                }
            }

            if (htmlData) {
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlData, "text/html");
                
                const ogImg = doc.querySelector('meta[property="og:image"]')?.content || 
                              doc.querySelector('meta[name="twitter:image"]')?.content ||
                              doc.querySelector('link[rel="image_src"]')?.href;
                              
                let ogTitle = doc.querySelector('meta[property="og:title"]')?.content || 
                              doc.querySelector('meta[name="twitter:title"]')?.content || 
                              doc.title || "Link Preview";
                              
                let domain = "";
                try {
                    domain = new URL(link).hostname;
                } catch(e) {
                    domain = link;
                }

                if (ogImg) {
                    previewHTML = `
                    <div class="link-preview" onclick="window.open('${link}', '_blank')">
                        <div class="link-image">
                            <img src="${ogImg}" alt="Preview" onerror="this.parentElement.style.display='none'">
                        </div>
                        <div class="link-info">
                            <div class="link-title">${ogTitle}</div>
                            <div class="link-domain"><i class="fas fa-link"></i> ${domain}</div>
                        </div>
                    </div>`;
                }
            }
            spinner.style.display = "none";
        }

        let formattedText = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
        formattedText = formattedText.replace(urlRegex, '<a href="$1" target="_blank">$1</a>');
        formattedText = formattedText.replace(/\n/g, '<br>');

        const msgHTML = `
        <div class="message-row">
            <div class="message-sent">
                ${previewHTML}
                <span class="msg-text">${formattedText}</span>
                <div class="msg-meta">
                    <span class="time">${time}</span>
                    <span class="ticks state-single"><i class="fas fa-check"></i></span>
                </div>
            </div>
        </div>`;

        chatBox.insertAdjacentHTML('beforeend', msgHTML);
        chatBox.scrollTop = chatBox.scrollHeight;
    });
  </script>
</body>
</html>
