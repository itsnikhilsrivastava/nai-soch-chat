<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WhatsApp Chat Viewer</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #0b141a; display: flex; flex-direction: column; height: 100dvh; color: #e9edef; overflow: hidden; }
    
    /* Header */
    .header { background-color: #1f2c34; padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; z-index: 10; height: 60px; box-sizing: border-box; }
    .header-left { display: flex; align-items: center; gap: 10px; flex: 1; }
    .back-btn { color: #e9edef; font-size: 20px; cursor: pointer; }
    .profile-pic { width: 40px; height: 40px; background-color: #364147; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #cfd9df; position: relative; }
    .profile-pic::after { content: ''; position: absolute; bottom: 0; right: 0; width: 12px; height: 12px; background-color: #e91e63; border-radius: 50%; border: 2px solid #1f2c34; }
    /* Editable Number */
    .chat-name { font-size: 18px; font-weight: 500; color: #e9edef; outline: none; border-bottom: 1px dashed transparent; transition: 0.3s; padding: 2px; }
    .chat-name:focus { border-bottom: 1px dashed #00a884; background: rgba(255,255,255,0.05); }
    .header-right { display: flex; align-items: center; gap: 20px; color: #e9edef; font-size: 20px; }

    /* Chat Area */
    .chat-container { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-repeat: repeat; background-color: #0b141a; background-blend-mode: overlay; opacity: 0.95; }
    
    .date-badge { align-self: center; background-color: #182229; color: #8696a0; font-size: 12px; padding: 5px 12px; border-radius: 10px; margin-top: 10px; }
    .enc-message { align-self: center; background-color: #182229; color: #ffd279; font-size: 12px; padding: 8px 12px; border-radius: 8px; text-align: center; max-width: 85%; margin-bottom: 10px; line-height: 1.4; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
    .enc-message i { font-size: 10px; margin-right: 5px; }

    /* Message Bubble */
    .message-row { display: flex; justify-content: flex-end; width: 100%; margin-bottom: 2px; }
    .message-sent { background-color: #005c4b; color: #e9edef; padding: 6px 8px 6px 10px; border-radius: 8px 0 8px 8px; max-width: 85%; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,0.1); font-size: 15px; line-height: 1.4; word-wrap: break-word; }
    
    /* Open Graph Link Preview */
    .link-preview { background-color: #025144; border-radius: 8px; overflow: hidden; margin-bottom: 5px; cursor: pointer; border-left: 4px solid #00a884; }
    .link-image { width: 100%; height: 160px; background-color: #111; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; }
    .link-image img { width: 100%; height: 100%; object-fit: cover; }
    .link-info { padding: 10px; }
    .link-title { font-weight: bold; font-size: 14px; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .link-domain { font-size: 12px; color: #8696a0; display: flex; align-items: center; gap: 5px; }
    
    .msg-text a { color: #53bdeb; text-decoration: none; }
    .msg-text a:hover { text-decoration: underline; }
    
    .msg-meta { display: flex; justify-content: flex-end; align-items: center; gap: 4px; margin-top: 2px; margin-right: 2px; float: right; margin-left: 15px; }
    .time { font-size: 11px; color: #8696a0; margin-top: 2px; }
    .ticks { color: #53bdeb; font-size: 12px; } /* Blue Ticks */

    /* Input Area */
    .input-container { background-color: #1f2c34; padding: 10px; display: flex; align-items: center; gap: 10px; }
    .input-box { flex: 1; background-color: #2a3942; border-radius: 24px; display: flex; align-items: center; padding: 0 15px; min-height: 45px; }
    .input-box i { color: #8696a0; font-size: 22px; cursor: pointer; padding: 10px 5px; }
    .input-box input { flex: 1; background: transparent; border: none; color: #e9edef; font-size: 16px; outline: none; padding: 10px; }
    .input-box input::placeholder { color: #8696a0; }
    
    .send-btn { width: 45px; height: 45px; border-radius: 50%; background-color: #00a884; color: white; display: flex; justify-content: center; align-items: center; font-size: 20px; border: none; cursor: pointer; flex-shrink: 0; }
    
    /* Loading Spinner */
    .loader { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #00a884; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: none; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <i class="fas fa-arrow-left back-btn"></i>
      <div class="profile-pic"><i class="fas fa-user"></i></div>
      <!-- Number is Editable -->
      <div class="chat-name" id="chat-header-name" contenteditable="true" title="Click to edit number">+91 63072 15940</div>
    </div>
    <div class="header-right">
      <i class="fas fa-video"></i>
      <i class="fas fa-phone-alt"></i>
      <i class="fas fa-ellipsis-v"></i>
    </div>
  </div>

  <!-- Chat Area -->
  <div class="chat-container" id="chat-box">
    <div class="date-badge">Today</div>
    <div class="enc-message">
      <i class="fas fa-lock"></i> Messages and calls are end-to-end encrypted. Only people in this chat can read, listen to, or share them. <b>Learn more</b>
    </div>
  </div>

  <!-- Input Area -->
  <div class="input-container">
    <div class="input-box">
      <i class="far fa-smile"></i>
      <input type="text" id="msg-input" placeholder="Message" autocomplete="off">
      <div id="loading-spinner" class="loader"></div>
      <i class="fas fa-paperclip" id="attach-icon"></i>
      <i class="fas fa-camera" id="camera-icon"></i>
    </div>
    <button class="send-btn" id="send-btn"><i class="fas fa-microphone" id="btn-icon"></i></button>
  </div>

  <script>
    const msgInput = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');
    const btnIcon = document.getElementById('btn-icon');
    const chatBox = document.getElementById('chat-box');
    const attachIcon = document.getElementById('attach-icon');
    const cameraIcon = document.getElementById('camera-icon');
    const spinner = document.getElementById('loading-spinner');

    // Change Mic to Send Button when typing
    msgInput.addEventListener('input', () => {
        if (msgInput.value.trim().length > 0) {
            btnIcon.className = "fas fa-paper-plane";
            attachIcon.style.display = "none";
            cameraIcon.style.display = "none";
        } else {
            btnIcon.className = "fas fa-microphone";
            attachIcon.style.display = "block";
            cameraIcon.style.display = "block";
        }
    });

    // Handle Enter Key
    msgInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            sendBtn.click();
        }
    });

    // Send Message Logic
    sendBtn.addEventListener('click', async () => {
        const text = msgInput.value.trim();
        if (!text) return;

        // Reset Input
        msgInput.value = "";
        btnIcon.className = "fas fa-microphone";
        attachIcon.style.display = "block";
        cameraIcon.style.display = "block";

        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }).toLowerCase();
        
        // Check for URL to fetch Open Graph Data
        const urlRegex = /(https?:\/\/[^\s]+)/g;
        const urls = text.match(urlRegex);
        
        let previewHTML = "";

        if (urls && urls.length > 0) {
            const link = urls[0];
            spinner.style.display = "block"; // Show loading
            
            try {
                // Free Proxy API to fetch website metadata (CORS bypass)
                const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(link)}`);
                const data = await response.json();
                
                const parser = new DOMParser();
                const doc = parser.parseFromString(data.contents, "text/html");
                
                // Get OG tags
                const ogImg = doc.querySelector('meta[property="og:image"]')?.content || doc.querySelector('meta[name="twitter:image"]')?.content;
                let ogTitle = doc.querySelector('meta[property="og:title"]')?.content || doc.title || "Link Preview";
                const domain = new URL(link).hostname;

                if (ogImg) {
                    previewHTML = `
                    <div class="link-preview" onclick="window.open('${link}', '_blank')">
                        <div class="link-image">
                            <img src="${ogImg}" alt="Preview" onerror="this.parentElement.style.display='none'">
                        </div>
                        <div class="link-info">
                            <div class="link-title">${ogTitle}</div>
                            <div class="link-domain"><i class="fas fa-link"></i> ${domain}</div>
                        </div>
                    </div>`;
                }
            } catch (error) {
                console.log("Could not fetch preview", error);
            }
            spinner.style.display = "none";
        }

        // Format Text (Make links clickable, handle line breaks)
        let formattedText = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
        formattedText = formattedText.replace(urlRegex, '<a href="$1" target="_blank">$1</a>');
        formattedText = formattedText.replace(/\n/g, '<br>');

        // Create Message HTML
        const msgHTML = `
        <div class="message-row">
            <div class="message-sent">
                ${previewHTML}
                <div class="msg-text">${formattedText}</div>
                <div class="msg-meta">
                    <span class="time">${time}</span>
                    <span class="ticks"><i class="fas fa-check-double"></i></span>
                </div>
            </div>
        </div>`;

        // Append to chat
        chatBox.insertAdjacentHTML('beforeend', msgHTML);
        chatBox.scrollTop = chatBox.scrollHeight;
    });

  </script>
</body>
</html>
