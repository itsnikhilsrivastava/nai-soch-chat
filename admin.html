<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NS Admin Dashboard</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f0f2f5; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
    .header { background-color: #075e54; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 10; }
    .header h2 { margin: 0; font-size: 18px; }
    .btn-group { display: flex; gap: 10px; }
    .btn { background: #128c7e; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    .btn-new { background: #25D366; }
    
    #room-list { flex: 1; overflow-y: auto; background: white; }
    .room-card { display: flex; padding: 15px; border-bottom: 1px solid #e0e0e0; cursor: pointer; align-items: center; }
    .room-card:hover { background: #f9f9f9; }
    .avatar { width: 45px; height: 45px; background: #ccc; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; margin-right: 15px; font-size: 18px; }
    .room-info { flex: 1; overflow: hidden; }
    .room-name { font-weight: bold; color: #333; font-size: 16px; margin-bottom: 5px; }
    .last-msg { color: #666; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90%; }
    
    .time-box { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
    .time { font-size: 11px; color: #999; }
    .action-btns { display: flex; gap: 10px; }
    .share-btn { color: #128c7e; background: none; border: none; font-size: 18px; cursor: pointer; padding: 5px; }
    .delete-btn { color: #ff4444; background: none; border: none; font-size: 18px; cursor: pointer; padding: 5px; }

    #chat-view { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 100; flex-direction: column; }
    #chat-frame { flex: 1; border: none; width: 100%; height: 100%; }
    .chat-header { background: #075e54; color: white; padding: 15px; display: flex; align-items: center; gap: 15px; font-weight: bold; }
    .back-btn { background: none; border: none; color: white; font-size: 18px; cursor: pointer; }

    #widget-modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 200; justify-content: center; align-items: center; }
    .modal-content { background: white; width: 85%; max-width: 400px; padding: 20px; border-radius: 10px; }
    .modal-content textarea { width: 100%; height: 120px; margin-top: 10px; padding: 10px; box-sizing: border-box; font-family: monospace; font-size: 12px; }
    .close-btn { background: red; color: white; padding: 8px 12px; border: none; border-radius: 5px; margin-top: 10px; width: 100%; font-weight:bold; }
  </style>
</head>
<body>

  <div class="header">
    <h2>NS Admin Panel</h2>
    <div class="btn-group">
      <button class="btn btn-new" onclick="createNewRoom()"><i class="fas fa-plus"></i></button>
      <button class="btn" onclick="showWidgetCode()"><i class="fas fa-code"></i></button>
    </div>
  </div>
  
  <div id="room-list">
    <p style="text-align:center; color:#999; margin-top: 20px;">चैट्स लोड हो रहे हैं...</p>
  </div>

  <div id="chat-view">
    <div class="chat-header">
      <button class="back-btn" onclick="closeChat()"><i class="fas fa-arrow-left"></i></button>
      <span id="active-room-name">Room Name</span>
    </div>
    <iframe id="chat-frame" src=""></iframe>
  </div>

  <div id="widget-modal">
    <div class="modal-content">
      <h3 style="margin-top:0; color:#075e54;">Website Widget Code</h3>
      <textarea id="embed-code" readonly></textarea>
      <button class="close-btn" onclick="document.getElementById('widget-modal').style.display='none'">बंद करें</button>
    </div>
  </div>

  <script type="module">
    import { ConvexClient } from "https://esm.sh/convex/browser";
    const CONVEX_URL = "https://beloved-hare-920.convex.cloud";
    const client = new ConvexClient(CONVEX_URL);

    client.onUpdate("messages:getActiveRooms", {}, (rooms) => {
      const roomListDiv = document.getElementById("room-list");
      if(rooms.length === 0) {
        roomListDiv.innerHTML = '<p style="text-align:center; margin-top:20px; color:#888;">अभी कोई एक्टिव चैट नहीं है।</p>';
        return;
      }
      roomListDiv.innerHTML = rooms.map(room => `
        <div class="room-card" onclick="openChat('${room.roomId}')">
          <div class="avatar"><i class="fas fa-user"></i></div>
          <div class="room-info">
            <div class="room-name">${room.roomId}</div>
            <div class="last-msg">${room.lastMessage}</div>
          </div>
          <div class="time-box">
            <div class="time">${new Date(room.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
            <div class="action-btns">
              <button class="share-btn" onclick="shareRoom(event, '${room.roomId}')" title="लिंक कॉपी करें"><i class="fas fa-share-alt"></i></button>
              <button class="delete-btn" onclick="deleteRoom(event, '${room.roomId}')" title="रूम डिलीट करें"><i class="fas fa-trash"></i></button>
            </div>
          </div>
        </div>
      `).join("");
    });

    // लिंक शेयर (कॉपी) करने का फंक्शन
    window.shareRoom = (event, roomId) => {
      event.stopPropagation();
      const link = window.location.origin + "/?room=" + roomId;
      navigator.clipboard.writeText(link).then(() => {
        alert("चैट रूम का लिंक कॉपी हो गया:\n" + link);
      }).catch(() => {
        alert("कॉपी करने के लिए यह लिंक शेयर करें:\n" + link);
      });
    };

    window.createNewRoom = () => {
      const roomName = prompt("नए रूम का नाम दर्ज करें (बिना स्पेस के):");
      if(roomName && roomName.trim() !== "") {
        const cleanName = roomName.trim().replace(/\s+/g, '-').toLowerCase();
        client.mutation("messages:sendMessage", {
          roomId: cleanName,
          text: "चैट रूम तैयार है।",
          sender: "System"
        });
        openChat(cleanName);
      }
    };

    window.deleteRoom = (event, roomId) => {
      event.stopPropagation();
      if(confirm(`क्या आप वाकई '${roomId}' रूम और इसके सारे मैसेज डिलीट करना चाहते हैं?`)) {
        client.mutation("messages:deleteRoom", { roomId: roomId });
      }
    };

    window.openChat = (roomId) => {
      localStorage.setItem(`ns_chat_name_${roomId}`, "NS Admin");
      document.getElementById('active-room-name').innerText = "चैट: " + roomId;
      document.getElementById('chat-frame').src = `/?room=${roomId}`;
      document.getElementById('chat-view').style.display = 'flex';
    };

    window.closeChat = () => {
      document.getElementById('chat-view').style.display = 'none';
      document.getElementById('chat-frame').src = "";
    };

    window.showWidgetCode = () => {
      const siteUrl = window.location.origin;
      const code = `
<!-- NS Live Chat Widget -->
<script>
  document.write('<iframe src="${siteUrl}/widget.html" style="position:fixed; bottom:20px; right:20px; width:350px; height:500px; border:none; border-radius:15px; box-shadow:0 5px 15px rgba(0,0,0,0.3); z-index:9999; background:transparent;"></iframe>');
</scr` + `ipt>`;
      document.getElementById('embed-code').value = code.trim();
      document.getElementById('widget-modal').style.display = 'flex';
    };
  </script>
</body>
</html>
