<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Dashboard</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f0f2f5; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
    .header { background-color: #075e54; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 10; }
    .header h2 { margin: 0; font-size: 18px; }
    .btn-group { display: flex; gap: 10px; }
    .btn { background: #128c7e; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    .btn-new { background: #25D366; }
    
    #room-list { flex: 1; overflow-y: auto; background: white; }
    .room-card { display: flex; padding: 15px; border-bottom: 1px solid #e0e0e0; cursor: pointer; align-items: center; }
    .room-card:hover { background: #f9f9f9; }
    .avatar { width: 45px; height: 45px; background: #ccc; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; margin-right: 15px; font-size: 18px; }
    .room-info { flex: 1; overflow: hidden; }
    .room-name { font-weight: bold; color: #333; font-size: 16px; margin-bottom: 5px; }
    .last-msg { color: #666; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90%; }
    
    .time-box { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
    .time { font-size: 11px; color: #999; }
    .action-btns { display: flex; gap: 10px; }
    .share-btn { color: #128c7e; background: none; border: none; font-size: 18px; cursor: pointer; padding: 5px; }
    .delete-btn { color: #ff4444; background: none; border: none; font-size: 18px; cursor: pointer; padding: 5px; }

    #chat-view { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 100; flex-direction: column; }
    #chat-frame { flex: 1; border: none; width: 100%; height: 100%; }
    .chat-header { background: #075e54; color: white; padding: 15px; display: flex; align-items: center; gap: 15px; font-weight: bold; }
    .back-btn { background: none; border: none; color: white; font-size: 18px; cursor: pointer; }

    #widget-modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 200; justify-content: center; align-items: center; }
    .modal-content { background: white; width: 85%; max-width: 450px; padding: 20px; border-radius: 10px; }
    .modal-content input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    .modal-content textarea { width: 100%; height: 120px; padding: 10px; box-sizing: border-box; font-family: monospace; font-size: 12px; border-radius: 5px; border: 1px solid #ccc; }
    .modal-btns { display: flex; gap: 10px; margin-top: 15px; }
    .modal-btns button { flex: 1; padding: 10px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; color: white; }
    .generate-btn { background: #075e54; }
    .close-btn { background: #ff4444; }
  </style>
</head>
<body>

  <div class="header">
    <h2>Admin Panel</h2>
    <div class="btn-group">
      <button class="btn btn-new" onclick="createNewRoom()" title="नया रूम बनाएं"><i class="fas fa-plus"></i></button>
      <button class="btn" onclick="changeAdminName()" title="सपोर्ट एजेंट का नाम बदलें"><i class="fas fa-user-edit"></i></button>
      <button class="btn" onclick="openWidgetModal()" title="विजेट कोड"><i class="fas fa-code"></i></button>
    </div>
  </div>
  
  <div id="room-list">
    <p style="text-align:center; color:#999; margin-top: 20px;">चैट्स लोड हो रहे हैं...</p>
  </div>

  <div id="chat-view">
    <div class="chat-header">
      <button class="back-btn" onclick="closeChat()"><i class="fas fa-arrow-left"></i></button>
      <span id="active-room-name">Room Name</span>
    </div>
    <iframe id="chat-frame" src=""></iframe>
  </div>

  <div id="widget-modal">
    <div class="modal-content">
      <h3 style="margin-top:0; color:#075e54;">Floating Widget Code</h3>
      <input type="text" id="site-source" placeholder="वेबसाइट का नाम (e.g., Blog, Shop)">
      <textarea id="embed-code" readonly placeholder="यहाँ कोड जनरेट होगा..."></textarea>
      <div class="modal-btns">
        <button class="generate-btn" onclick="generateWidgetCode()">कोड बनाएं</button>
        <button class="close-btn" onclick="document.getElementById('widget-modal').style.display='none'">बंद करें</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { ConvexClient } from "https://esm.sh/convex/browser";
    const CONVEX_URL = "https://beloved-hare-920.convex.cloud";
    const client = new ConvexClient(CONVEX_URL);
    
    let agentJoinedRooms = new Set();
    
    let myAdminName = localStorage.getItem('my_admin_name');
    if (!myAdminName) {
        myAdminName = prompt("कृपया सपोर्ट एजेंट के तौर पर अपना नाम दर्ज करें:", "Nik");
        if (!myAdminName || myAdminName.trim() === "") {
            myAdminName = "Live Support Agent";
        }
        localStorage.setItem('my_admin_name', myAdminName);
    }

    window.changeAdminName = () => {
        const newName = prompt("विजेट चैट में सपोर्ट एजेंट का नाम दर्ज करें:", myAdminName);
        if (newName && newName.trim() !== "") {
            myAdminName = newName.trim();
            localStorage.setItem('my_admin_name', myAdminName);
            alert("सपोर्ट एजेंट का नाम अपडेट हो गया है: " + myAdminName);
        }
    };

    client.onUpdate("messages:getActiveRooms", {}, (rooms) => {
      const roomListDiv = document.getElementById("room-list");
      if(rooms.length === 0) {
        roomListDiv.innerHTML = '<p style="text-align:center; margin-top:20px; color:#888;">अभी कोई एक्टिव चैट नहीं है।</p>';
        return;
      }
      roomListDiv.innerHTML = rooms.map(room => `
        <div class="room-card" onclick="openChat('${room.roomId}')">
          <div class="avatar"><i class="fas fa-user"></i></div>
          <div class="room-info">
            <div class="room-name">${room.roomId}</div>
            <div class="last-msg">${room.lastMessage}</div>
          </div>
          <div class="time-box">
            <div class="time">${new Date(room.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
            <div class="action-btns">
              <button class="share-btn" onclick="shareRoom(event, '${room.roomId}')" title="लिंक कॉपी करें"><i class="fas fa-share-alt"></i></button>
              <button class="delete-btn" onclick="deleteRoom(event, '${room.roomId}')" title="रूम डिलीट करें"><i class="fas fa-trash"></i></button>
            </div>
          </div>
        </div>
      `).join("");
    });

    window.shareRoom = (event, roomId) => {
      event.stopPropagation();
      const link = window.location.origin + "/?room=" + roomId;
      navigator.clipboard.writeText(link).then(() => { alert("चैट रूम का लिंक कॉपी हो गया!"); });
    };

    window.createNewRoom = () => {
      const roomName = prompt("नए रूम का नाम दर्ज करें (बिना स्पेस के):");
      if(roomName && roomName.trim() !== "") {
        const limitStr = prompt("इस रूम में अधिकतम कितने लोग जुड़ सकते हैं? (जैसे: 2, 5)\n(अगर कोई लिमिट नहीं रखनी है तो 0 लिखें या खाली छोड़ दें):");
        const limitValue = parseInt(limitStr) || 0;
        
        const cleanName = roomName.trim().replace(/\s+/g, '-').toLowerCase();
        
        client.mutation("messages:sendMessage", { 
          roomId: cleanName, 
          text: `चैट रूम तैयार है।${limitValue > 0 ? ` (लिमिट: ${limitValue} लोग)` : ''}`, 
          sender: "System",
          limit: limitValue
        });
        openChat(cleanName); // नया रूम बनाने के बाद खोलें
      }
    };

    window.deleteRoom = (event, roomId) => {
      event.stopPropagation();
      if(confirm(`क्या आप वाकई '${roomId}' रूम और इसके सारे मैसेज डिलीट करना चाहते हैं?`)) {
        client.mutation("messages:deleteRoom", { roomId: roomId });
      }
    };

    window.openChat = (roomId) => {
      document.getElementById('active-room-name').innerText = "चैट: " + roomId;
      
      // स्मार्ट चेक: क्या यह विजेट वाला रूम है?
      if (roomId.startsWith('w_')) {
          // विजेट रूम: सपोर्ट एजेंट के तौर पर ऑटो-लॉगिन करें
          localStorage.setItem(`ns_chat_name_${roomId}`, myAdminName);
          
          if (!agentJoinedRooms.has(roomId)) {
              client.mutation("messages:sendMessage", {
                  roomId: roomId,
                  text: `👨‍💻 सपोर्ट एजेंट (${myAdminName}) चैट से जुड़ गए हैं।`,
                  sender: "System"
              });
              agentJoinedRooms.add(roomId);
          }
      } 
      // अगर विजेट रूम नहीं है (जैसे फ्रेंड्स वाला), तो हम कोई लोकल स्टोरेज सेट नहीं करेंगे।
      // आईफ्रेम खुलेगा और इंडेक्स फाइल आपको नॉर्मल लॉगिन स्क्रीन दिखाएगी।

      document.getElementById('chat-frame').src = `/?room=${roomId}`;
      document.getElementById('chat-view').style.display = 'flex';
    };

    window.closeChat = () => {
      document.getElementById('chat-view').style.display = 'none';
      document.getElementById('chat-frame').src = "";
    };

    window.openWidgetModal = () => {
      document.getElementById('embed-code').value = '';
      document.getElementById('site-source').value = '';
      document.getElementById('widget-modal').style.display = 'flex';
    };

    window.generateWidgetCode = () => {
      const siteUrl = window.location.origin;
      const source = document.getElementById('site-source').value.trim() || 'Website';
      const encodedSource = encodeURIComponent(source);
      
      const code = `
<!-- Live Chat Floating Button -->
<style>
#lsChatBtn{ position:fixed; bottom:20px; right:20px; width:60px; height:60px; border-radius:50%; background:#075e54; color:#fff; font-size:28px; border:none; cursor:pointer; box-shadow:0 4px 12px rgba(0,0,0,.3); z-index:99999; display:flex; align-items:center; justify-content:center; }
#lsChatBox{ position:fixed; bottom:90px; right:20px; width:350px; height:500px; border:none; border-radius:15px; box-shadow:0 5px 20px rgba(0,0,0,.3); display:none; z-index:99999; background:#fff; }
@media(max-width:768px){ #lsChatBox{ width:95%; height:80%; right:2.5%; bottom:80px; } }
</style>

<button id="lsChatBtn">💬</button>
<iframe id="lsChatBox" src="${siteUrl}/widget.html?source=${encodedSource}"></iframe>

<script>
const btn = document.getElementById("lsChatBtn");
const chat = document.getElementById("lsChatBox");
btn.onclick = function(){
  if(chat.style.display==="block"){
    chat.style.display="none";
    btn.innerHTML="💬";
  }else{
    chat.style.display="block";
    btn.innerHTML="✖";
  }
}
</scr` + `ipt>`;
      document.getElementById('embed-code').value = code.trim();
    };
  </script>
</body>
</html>
